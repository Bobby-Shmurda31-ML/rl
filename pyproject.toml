[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "rl-learning"
version = "0.1.0"
requires-python = ">=3.8"
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "gymnasium>=1.0.0",
    "pygame>=2.6.0",
    "wandb>=0.27.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["rl*"]
